# Example: publish Tail Trails at https://tailtrails.exampleshelter.com/

<VirtualHost *:80>
  ServerName tailtrails.exampleshelter.com

  RewriteEngine On
  RewriteRule ^ https://tailtrails.exampleshelter.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  Protocols h2 http/1.1
  ServerName tailtrails.exampleshelter.com

  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/exampleshelter.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/exampleshelter.com/privkey.pem

  ProxyRequests Off
  # set timeout in seconds
  ProxyPass / http://127.0.0.1:8000/ timeout=600 upgrade=websocket
  ProxyPassReverse / http://127.0.0.1:8000/
  ProxyPreserveHost On
</VirtualHost>
