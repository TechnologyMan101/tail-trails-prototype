# Example: publish Tail Trails at https://tailtrails.exampleshelter.com/
server {
    listen 80;
    listen [::]:80;
    server_name tailtrails.exampleshelter.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tailtrails.exampleshelter.com;

    ssl_certificate /etc/letsencrypt/live/exampleshelter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exampleshelter.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Five 25 MiB animal photos plus multipart overhead.
    client_max_body_size 160m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # Do not buffer the administrator System Information SSE stream.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

